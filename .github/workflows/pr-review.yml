name: PR Review (远程 CC 自动评审)

# 只跑仓库内 PR;外部 fork 自动 skip(每个 job 用 if 守门)。
# 详细说明见 docs/plans/2026-05-15-remote-review-bot.md 安全前提。

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  statuses: write

# 同 PR 多 commit 只跑最新一次,省 CI 分钟
concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  list-specs:
    # 只在仓库内 PR 上跑
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      specs: ${{ steps.list.outputs.specs }}
      skipReproReason: ${{ steps.list.outputs.skipReason }}
      excludedSpecs: ${{ steps.list.outputs.excludedSpecs }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      # skip-repro label 是「PR 级显式豁免」,优先于 spec.ci.skip(spec 级豁免)。
      # 标签命中 → 不必装 pnpm/node 跑 list-ci-specs,直接早退。
      - id: label-shortcut
        shell: bash
        env:
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          if echo "$PR_LABELS" | jq -e '. | index("skip-repro")' >/dev/null; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
            echo "::notice::PR 带 skip-repro label —— 跳过 repro 检查"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi
      # 没命中 skip-repro label,装依赖跑 list-ci-specs.ts 读 spec.ci.skip 分桶。
      # (要装 pnpm/node 是因为 spec 是 .ts,需要 tsx + 解析它的 import)
      - if: steps.label-shortcut.outputs.hit != 'true'
        uses: ./.github/actions/setup-repo
      - id: list
        shell: bash
        env:
          LABEL_HIT: ${{ steps.label-shortcut.outputs.hit }}
        run: |
          set -euo pipefail
          if [[ "$LABEL_HIT" == "true" ]]; then
            echo 'specs=[]' >> "$GITHUB_OUTPUT"
            echo 'excludedSpecs=[]' >> "$GITHUB_OUTPUT"
            echo 'skipReason=skip-repro label' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # list-ci-specs.ts 输出形如 {"included":[...],"excluded":[{...}],"note":"..."}
          payload=$(npx tsx scripts/verify/list-ci-specs.ts)
          echo "list-ci-specs raw: $payload"
          included=$(echo "$payload" | jq -c '.included')
          excluded=$(echo "$payload" | jq -c '.excluded')
          note=$(echo "$payload" | jq -r '.note // ""')
          echo "specs=$included" >> "$GITHUB_OUTPUT"
          echo "excludedSpecs=$excluded" >> "$GITHUB_OUTPUT"
          # 决定 skipReason —— 仅在 included 为空时才填,否则保持空(repro 会真跑)
          incl_count=$(echo "$included" | jq 'length')
          excl_count=$(echo "$excluded" | jq 'length')
          if [[ "$incl_count" == "0" ]]; then
            if [[ -n "$note" ]]; then
              reason="$note"
            elif [[ "$excl_count" == "0" ]]; then
              reason="no-specs-discovered"
            else
              # 全部 spec 都被 ci.skip 标记 → 把它们的 reason 拼起来
              reason="all-specs-ci-skip: $(echo "$excluded" | jq -r 'map(.file + " (\(.reason))") | join("; ")')"
            fi
            echo "skipReason=$reason" >> "$GITHUB_OUTPUT"
            echo "::warning::没有需要跑的 spec ($reason)"
          else
            echo 'skipReason=' >> "$GITHUB_OUTPUT"
            echo "找到 included spec: $included"
            if [[ "$excl_count" != "0" ]]; then
              echo "::notice::被豁免的 spec(ci.skip=true): $excluded"
            fi
          fi

  repro:
    needs: list-specs
    if: needs.list-specs.outputs.specs != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        spec: ${{ fromJson(needs.list-specs.outputs.specs) }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: ./.github/actions/setup-repo
      - name: Build teamagent (有的 spec 跑 dist/bin.js)
        run: pnpm --filter teamagent build
      - name: Run repro
        run: |
          slug=$(basename "${{ matrix.spec }}" .ts)
          mkdir -p "/tmp/repro-out/$slug"
          npx tsx scripts/verify/repro-cli.ts "${{ matrix.spec }}" --no-gif \
            --out "/tmp/repro-out/$slug"
        # ↑ 退出码 0/1 反映 verdict;不要 ||true,要让失败浮出来
      - uses: actions/upload-artifact@v4
        with:
          name: repro-${{ strategy.job-index }}
          path: /tmp/repro-out/

  tests:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0          # review 标准 2 需要 git merge-base / merge-tree,要全历史
      - uses: ./.github/actions/setup-repo
      - name: pnpm test
        run: pnpm test
      - name: Working tree must be clean
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::tests 跑完后工作树不干净:"
            git status --porcelain
            exit 1
          fi

  verdict:
    needs: [list-specs, repro, tests]
    # always() —— 不管 repro/tests 怎么挂,都跑一次去发评论 + 设 status,
    # 否则 PR 上不显示任何 verdict,体验差。
    if: always() && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: ./.github/actions/setup-repo
      - name: Download all repro artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/repro-out-all
          pattern: repro-*
          merge-multiple: true
      - name: Aggregate verdict
        shell: bash
        env:
          REPRO_OUTCOME: ${{ needs.repro.result }}                # success / failure / skipped / cancelled
          TESTS_OUTCOME: ${{ needs.tests.result }}
          SKIP_REPRO_REASON: ${{ needs.list-specs.outputs.skipReproReason }}
          EXCLUDED_SPECS: ${{ needs.list-specs.outputs.excludedSpecs }}
        run: |
          mkdir -p /tmp/agg
          # 把 ci.skip 标记的 spec 渲成一段附注(给 repro_summary 用,让 verdict comment 显示):
          excluded_note=""
          if [[ -n "$EXCLUDED_SPECS" && "$EXCLUDED_SPECS" != "[]" ]]; then
            excluded_note=" · 显式豁免: $(echo "$EXCLUDED_SPECS" | jq -r 'map(.file + " (\(.reason))") | join("; ")')"
          fi
          # repro_ok 计算(三态豁免见安全前提):
          #   - REPRO_OUTCOME = success → ok
          #   - REPRO_OUTCOME = skipped 且 SKIP_REPRO_REASON 非空 → ok(显式豁免:bootstrap / docs-only / all-ci-skip)
          #   - 其它 → 不 ok
          if [[ "$REPRO_OUTCOME" == "success" ]]; then
            repro_ok=true
            repro_summary="verdict=pass (all included specs)$excluded_note"
          elif [[ "$REPRO_OUTCOME" == "skipped" && -n "$SKIP_REPRO_REASON" ]]; then
            repro_ok=true
            repro_summary="豁免 — $SKIP_REPRO_REASON"
          else
            repro_ok=false
            repro_summary="verdict=fail/missing (REPRO_OUTCOME=$REPRO_OUTCOME)$excluded_note"
          fi
          if [[ "$TESTS_OUTCOME" == "success" ]]; then
            tests_ok=true
            tests_summary="tests pass + tree clean"
          else
            tests_ok=false
            tests_summary="tests failed or tree dirty (TESTS_OUTCOME=$TESTS_OUTCOME)"
          fi
          verdict=$([[ "$repro_ok" == "true" && "$tests_ok" == "true" ]] && echo "pass" || echo "fail")
          jq -n \
            --arg generatedAt "$(date -u +%FT%TZ)" \
            --arg verdict "$verdict" \
            --argjson repro_ok "$repro_ok" \
            --argjson tests_ok "$tests_ok" \
            --arg repro_summary "$repro_summary" \
            --arg tests_summary "$tests_summary" \
            '{
              generatedAt: $generatedAt, verdict: $verdict,
              criteria: [
                {id:"repro-pass", ok:$repro_ok, summary:$repro_summary, details:""},
                {id:"tests-and-merge-clean", ok:$tests_ok, summary:$tests_summary, details:""}
              ]
            }' > /tmp/agg/review-verdict.json
          cat /tmp/agg/review-verdict.json
      - name: Post comment + set status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          npx tsx scripts/review/post-pr-comment.ts \
            --verdict /tmp/agg/review-verdict.json \
            --pr ${{ github.event.pull_request.number }} \
            --sha ${{ github.event.pull_request.head.sha }} \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
